[project]
name = "lan-unit-management"
version = "0.1.0"
description = "LAN-based military unit management application"
requires-python = ">=3.11"
dependencies = [
    "email-validator>=2.2.0",
    "flask-dance>=7.1.0",
    "flask>=3.1.1",
    "flask-sqlalchemy>=3.1.1",
    "gunicorn>=23.0.0",
    "oauthlib>=3.2.2",
    "psycopg2-binary>=2.9.10",
    "pyjwt>=2.10.1",
    "sqlalchemy>=2.0.41",
    "werkzeug>=3.1.3",
    "flask-login>=0.6.3",
    "flask-migrate>=4.1.0",
    "python-dotenv>=1.1.0",
    "waitress>=3.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.4.0"]

[project.scripts]
lan-app = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
